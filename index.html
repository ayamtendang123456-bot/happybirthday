<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Selamat Ulang Tahun - Ucapan spesial penuh cinta untukmu">
  <title>Happy Birthday! 🎂</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@400;600;700&family=Fredoka+One&display=swap"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <link rel="shortcut icon" type="image/x-icon" href="./img/hbd.png">
</head>

<body>
  <audio id="background-music" src="./music/monokrom.mp3" preload="auto" muted loop></audio>

  <!-- Tombol Play/Pause Musik -->
  <button id="music-toggle-btn" aria-label="Play/Pause Musik" title="Play/Pause Musik">
    <span id="music-btn-icon">▶</span>
    <span id="music-btn-label">Putar</span>
  </button>

  <style>
    #music-toggle-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(255,150,200,0.85), rgba(220,80,160,0.85));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      padding: 11px 20px;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(220,80,160,0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: musicBtnAppear 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    #music-toggle-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(220,80,160,0.65);
    }
    #music-toggle-btn:active { transform: scale(0.96); }
    #music-btn-icon { font-size: 16px; }
    @keyframes musicBtnAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0)   scale(1);   }
    }
  </style>

  <!-- Falling flower petals canvas -->
  <canvas id="petalCanvas" aria-hidden="true"></canvas>

  <!-- Animated CSS Clouds -->
  <div class="clouds-container" aria-hidden="true">
    <!-- Top area clouds -->
    <div class="cloud cloud-lg cloud-1" style="top:5%; left:5%;   opacity:0.85;"></div>
    <div class="cloud cloud-md cloud-2" style="top:8%; left:55%;  opacity:0.75;"></div>
    <div class="cloud cloud-sm cloud-3" style="top:3%; left:78%;  opacity:0.7; "></div>
    <!-- Mid area clouds -->
    <div class="cloud cloud-lg cloud-4" style="top:28%; right:4%; opacity:0.65;"></div>
    <div class="cloud cloud-sm cloud-5" style="top:35%; left:2%;  opacity:0.6; "></div>
    <!-- Lower area clouds -->
    <div class="cloud cloud-md cloud-6" style="top:58%; left:12%; opacity:0.55;"></div>
    <div class="cloud cloud-sm cloud-7" style="top:65%; right:8%; opacity:0.5; "></div>
    <div class="cloud cloud-lg cloud-8" style="top:80%; left:40%; opacity:0.45;"></div>
  </div>

  <!-- Floating emoji particles -->
  <div class="floating-emojis" id="floatingEmojis" aria-hidden="true"></div>

  <div class="bg" id="content">

    <!-- Countdown Timer -->
    <div class="container" id="timer">
      <h5>Countdown to <x id="name"></x> birthday :</h5>
      <ul>
        <li><span id="days"></span>days</li>
        <li><span id="hours"></span>Hours</li>
        <li><span id="minutes"></span>Minutes</li>
        <li><span id="seconds"></span>Seconds</li>
      </ul>
      <p class="timer-hint">yang sabar yahh&nbsp;🤭<br>nanti kebuka sendiri kalau udah sesuai tanggalnya heheheeh&nbsp;🎀</p>
    </div>

    <!-- Slide 1: Image -->
    <div id="slideSatu" class="animate__animated animate__slideInDown animate__slow d-none">
      <img src="./img/hbd1.png" class="img" alt="Happy Birthday">
    </div>

    <!-- Slide 2: Pesan 1 -->
    <div id="slideDua"
      class="slides d-none paper animate__zoomInDown animate__animated animate__delay-2s animate__slow">
      <div class="paper-content">
        <p id="teks1" class="teks"></p>
      </div>
      <img src="./img/cap.webp" class="paper-stamp" alt="cap from Arif">
    </div>

    <!-- Slide 3: Pesan 2 -->
    <div id="slideTiga" class="slides d-none paper animate__fadeInRight animate__animated">
      <div class="paper-content">
        <p id="teks2" class="teks"></p>
      </div>
      <img src="./img/cap.webp" class="paper-stamp" alt="cap from Arif">
    </div>

    <!-- Slide 4: Suka/Gak -->
    <div class="kotak d-none slides animate__animated animate__fadeInDown animate__delay-2s" id="slideEmpat">
      <div class="row">
        <div class="col-sm mt-1">
          <h5>Kamu suka nggak? 🎀</h5>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-4 offset-2">
          <button id="gak" class="btn btn-outline-danger">Gak! 😅</button>
        </div>
        <div class="col-4">
          <button id="suka" class="btn btn-outline-info">Suka!! 💖</button>
        </div>
      </div>
    </div>

    <!-- Slide 5: Hati -->
    <div id="slideLima" class="d-none animate__bounceIn animate__animated animate__slow">
      <i class="fas fa-heart fa-5x text-danger"></i>
    </div>
    <p id="trims" class="d-none mt-2"></p>

    <div id="slideEnam" class="lanjut-box d-none animate__animated animate__fadeInUp animate__slow">
      <p class="lanjut-teks">Masih ada satu kejutan kecil lagi.</p>
      <a href="./love/index_love.html" class="lanjut-button" aria-label="Klik untuk lanjutkan ke halaman berikutnya">
        <i class="fas fa-heart"></i>
        <span>Klik untuk lanjutkan</span>
      </a>
    </div>

    <!-- Tap hint -->
    <p id="tap" class="d-none animate__animated animate__pulse animate__slow animate__repeat-3">Ketuk untuk melanjutkan
    </p>

    <!-- Footer -->
    <footer class="page-footer font-small blue fixed-bottom"></footer>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous">
    </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous">
    </script>
  <script src="https://kit.fontawesome.com/61e5120832.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/typeit@7.0.4/dist/typeit.min.js"></script>
  <script src="https://momentjs.com/downloads/moment.js"></script>
  <script src="https://momentjs.com/downloads/moment-with-locales.js"></script>
  <script src="https://momentjs.com/downloads/moment-timezone-with-data.js"></script>
  <script src="script.js"></script>
</body>

</html>
